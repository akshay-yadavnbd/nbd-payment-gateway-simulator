
# Application identity
spring.application.name=nbd-payments

# HTTP server configuration
server.port=8080

# Show readable startup logs
logging.level.root=INFO
logging.level.com.nbd.payments=INFO

#postgreSQL connection

spring.datasource.url=jdbc:postgresql://localhost:5432/nbd_payments
spring.datasource.username=${DB_USERNAME:nbd_app}
spring.datasource.password=${DB_PASSWORD}

#postgreSQL JDBC driver
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA/ Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false


# Flyway migration configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

#System admin

nbd.admin.email=${ADMIN_EMAIL}
nbd.admin.password-hash=${ADMIN_PASSWORD_HASH}

#Session settings

server.servlet.session.timeout = 30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site = lax

#Email verification

spring.mail.host=${SMTP_HOST:smtp.hostinger.com}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USERNAME:connect@nwatch.in}
spring.mail.password=${SMTP_PASSWORD}
app.mail.from=${FROM_EMAIL:connect@nwatch.in}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

# Disable STARTTLS when using SSL port 465
spring.mail.properties.mail.smtp.starttls.enable=false

# Connection timeouts
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#keeping cookies false for the local testing 
app.security.cookie-secure=${COOKIE_SECURE:false}

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.transaction=TRACE
logging.level.org.springframework.mail=DEBUG

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.timeout=2000ms