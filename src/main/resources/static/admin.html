
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBD Payments - Admin</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container">

    <nav>
        <a href="/merchant.html">Merchant</a>
        <a href="/payment.html">Payment</a>
    </nav>

    <h1>System Admin</h1>

    <!-- Admin Login -->
    <div class="card" id="loginSection">
        <h2>Admin Login</h2>

        <form id="adminLoginForm">
            <input
                id="adminEmail"
                type="email"
                placeholder="Email"
                required
            >

            <input
                id="adminPassword"
                type="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <div id="adminLoginMessage"></div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" class="hidden">
        
            <button id="adminLogoutBtn"
                    type="button"
                    class="secondary">
                Logout
            </button>

        <div class="card">
            <h2>Merchant Management</h2>

            <button onclick="loadAdminData()">
                Refresh Data
            </button>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Merchant ID</th>
                            <th>Business</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Change Status</th>
                        </tr>
                    </thead>

                    <tbody id="adminMerchants"></tbody>
                </table>
            </div>

            <div id="merchantMessage"></div>
        </div>

        <div class="card">
            <h2>All Transactions</h2>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Payment ID</th>
                            <th>Amount</th>
                            <th>Currency</th>
                            <th>Status</th>
                            <th>Error</th>
                            <th>Date</th>
                        </tr>
                    </thead>

                    <tbody id="adminTransactions"></tbody>
                </table>
            </div>
        </div>

    </div>

</div>

<script src="/js/app.js"></script>

<script>

    const params = new URLSearchParams(window.location.search);

if (params.get("sessionExpired") === "true") {

    showMessage(
        "adminLoginMessage",
        "Your session has expired. Please log in again.",
        false
    );

    window.history.replaceState(
        {},
        document.title,
        "/admin.html"
    );
}

// Admin Login
document.getElementById("adminLoginForm")
    .addEventListener("submit", async (event) => {

        event.preventDefault();

        try {
            await api("/api/v1/admin/login", {
                method: "POST",
                body: JSON.stringify({
                    email: document.getElementById("adminEmail").value,
                    password: document.getElementById("adminPassword").value
                })
            });

            document.getElementById("loginSection")
                .classList.add("hidden");

            document.getElementById("adminDashboard")
                .classList.remove("hidden");

            await loadAdminData();

        } catch (error) {
            showMessage(
                "adminLoginMessage",
                error.message,
                false
            );
        }
    });

// Admin logout


document.getElementById("adminLogoutBtn")
    .addEventListener("click", async () => {

        const button = document.getElementById("adminLogoutBtn");
        button.disabled = true;

        try {
            const csrf = await getCsrfToken("admin");

            await api("/logout", {
                method: "POST",
                headers: csrf
            });

            document.getElementById("adminDashboard")
                .classList.add("hidden");

            document.getElementById("loginSection")
                .classList.remove("hidden");

            document.getElementById("adminLoginForm").reset();

            showMessage(
                "adminLoginMessage",
                "Logged out successfully."
            );

        } catch (error) {
            showMessage(
                "merchantMessage",
                "Logout failed: " + error.message,
                false
            );
        } finally {
            button.disabled = false;
        }
    });

// Load Merchant and Transaction Data
async function loadAdminData() {

    try {
        const merchants = await api(
            "/api/v1/admin/merchants"
        );

        const transactions = await api(
            "/api/v1/admin/transactions"
        );

        renderMerchants(merchants);
        renderTransactions(transactions);

    } catch (error) {
        showMessage(
            "merchantMessage",
            error.message,
            false
        );
    }
}


// Display Merchants
function renderMerchants(merchants) {

    const table = document.getElementById("adminMerchants");
    table.replaceChildren();

    merchants.forEach(merchant => {

        const row = document.createElement("tr");

        const values = [
            merchant.merchantId,
            merchant.businessName,
            merchant.email,
            merchant.status
        ];

        values.forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value ?? "";
            row.appendChild(cell);
        });

        const actionCell = document.createElement("td");
        const select = document.createElement("select");

        ["PENDING", "ACTIVE", "REJECTED", "SUSPENDED"]
            .forEach(status => {

                const option = document.createElement("option");
                option.value = status;
                option.textContent = status;
                select.appendChild(option);
            });

        select.value = merchant.status;

        const button = document.createElement("button");
        button.textContent = "Update";

        button.addEventListener("click", () => {
            updateMerchantStatus(
                merchant.merchantId,
                select.value
            );
        });

        actionCell.appendChild(select);
        actionCell.appendChild(button);
        row.appendChild(actionCell);

        table.appendChild(row);
    });
}


// Update Merchant Status
async function updateMerchantStatus(merchantId, status) {

    if (!confirm(`Change merchant status to ${status}?`)) {
        return;
    }

    try {
        const csrf = await getCsrfToken("admin");

        await api(
            `/api/v1/admin/merchants/${encodeURIComponent(merchantId)}/status`,
            {
                method: "PATCH",
                headers: csrf,
                body: JSON.stringify({
                    status: status
                })
            }
        );

        showMessage(
            "merchantMessage",
            "Merchant status updated successfully"
        );

        await loadAdminData();

    } catch (error) {
        showMessage(
            "merchantMessage",
            error.message,
            false
        );
    }
}


// Display All Transactions
function renderTransactions(transactions) {

    const table = document.getElementById("adminTransactions");
    table.replaceChildren();

    transactions.forEach(payment => {

        const row = document.createElement("tr");

        const values = [
            payment.paymentId,
            formatAmount(payment.amountPaise),
            payment.currency,
            payment.status,
            payment.errorCode || "-",
            payment.createdAt
                ? new Date(payment.createdAt).toLocaleString()
                : "-"
        ];

        values.forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value ?? "";
            row.appendChild(cell);
        });

        table.appendChild(row);
    });
}

</script>

</body>
</html>
